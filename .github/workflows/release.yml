name: release

on:
  # Dispatched as well as pushed to: auto-release.yml creates the tag with GITHUB_TOKEN when a
  # release note is merged, and a tag pushed with that token deliberately does not trigger
  # `on: push: tags`. workflow_dispatch is documented as an exception that always creates a run.
  # Dispatched at the tag's ref, so github.ref_name below is the tag either way.
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release path packs and publishes without re-running validate/sample/e2e, on the grounds
  # that the tagged commit already went through them on its pull request. That reasoning only
  # holds if the commit is genuinely on the default branch — a tag cut from an unmerged branch,
  # or from a commit force-pushed away since, would ship having been verified by nothing. Two
  # cheap ubuntu minutes to make the assumption explicit rather than implicit.
  guard:
    name: verify the tag is on the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that never went through a pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # A tag push checks out the tag, and the default branch's ref is not necessarily among
          # the refs fetched with it, so ask for it by name before testing ancestry.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of ${DEFAULT_BRANCH}. Releases skip the test suites because the tagged commit was verified on its pull request; this commit was not. Merge it first, then re-tag."
            exit 1
          fi

          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on ${DEFAULT_BRANCH}" >> "$GITHUB_STEP_SUMMARY"

  # The tag does not decide what gets stamped — the package packs at its own pin from
  # Directory.Build.props — but it is what the GitHub release and the changelog range are named
  # after, so a tag that disagrees with the props would advertise a version nobody published.
  # Cheap to assert here, and impossible to notice afterwards.
  version:
    name: resolve release version
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          case "${VERSION}" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '${GITHUB_REF_NAME}' does not look like a version (expected e.g. v2.34.1.2)"
              exit 1
              ;;
          esac

          sdk="$(sed -n 's:.*<OpenTokIosVersion>\(.*\)</OpenTokIosVersion>.*:\1:p' Directory.Build.props | head -1)"
          revision="$(sed -n 's:.*<OpenTokBindingRevision>\(.*\)</OpenTokBindingRevision>.*:\1:p' Directory.Build.props | head -1)"
          expected="${sdk}.${revision}"

          if [ "${VERSION%%-*}" != "${expected}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match Directory.Build.props (${expected}). Bump the props or move the tag."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  # The tag is the release's label; the package publishes at its own pin from
  # Directory.Build.props. Republishing a version that did not move is a no-op — the push below
  # uses --skip-duplicate.
  build:
    name: build
    needs: [guard, version]
    uses: ./.github/workflows/build.yml
    with:
      # Verification already happened on this commit's pull request, and the guard job above
      # proved the tag points at that commit. A release packs and publishes, nothing more.
      verify: false

  publish:
    name: publish to nuget.org and create release
    needs: [build]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Compose release notes
        run: |
          . ./build/pins.sh
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # A curated docs/release-notes/<version>.md replaces the generated commit list when one
          # exists. The second lookup drops the prerelease suffix, so v2.27.1.2-beta.3 reuses the
          # notes written for 2.27.1.2 rather than silently falling back to raw commit subjects.
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"

          {
            if [ -f "${notes}" ]; then
              echo "==> using curated notes from ${notes}" >&2
              cat "${notes}"
              echo
              if [ -n "${previous}" ]; then
                echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              fi
            else
              echo "## What's changed"
              echo
              if [ -n "${previous}" ]; then
                git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
                echo
                echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              else
                echo "Initial release."
              fi
            fi
            echo
            echo "## Package"
            echo
            echo "Bound against OTXCFramework \`${OPENTOK_IOS_VERSION}\` (CocoaPods trunk)."
            echo
            echo "| Package | NuGet |"
            echo "| --- | --- |"
            echo "| \`OpenTok.Net.iOS\` | [${OPENTOK_PACKAGE_VERSION}](https://www.nuget.org/packages/OpenTok.Net.iOS/${OPENTOK_PACKAGE_VERSION}) |"
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
