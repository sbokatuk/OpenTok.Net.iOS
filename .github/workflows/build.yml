name: build

# Reusable pipeline: packs OpenTok.Net.iOS (at its own version from Directory.Build.props,
# optionally suffixed for prereleases), validates the result, builds the MAUI sample against the
# packed package, and runs the simulator smoke tests.

on:
  workflow_call:
    inputs:
      verify:
        description: >
          Whether to run the verification jobs — package validation, the sample builds, the
          Release link checks and the e2e suites. Pull requests leave it at true, and are the only
          place any of this runs. Releases pass false: the tagged commit was already verified on
          its pull request, so a tag packs and publishes and nothing more. The gate is the same
          input, with the same name and the same meaning, in every repository.
        required: false
        default: true
        type: boolean
      suffix:
        description: >
          Optional prerelease suffix (e.g. beta.12.34) appended to the package's version.
        required: false
        default: ''
        type: string
      e2e-target-frameworks:
        description: >
          Which of the package's target frameworks the simulator smoke tests run against, as a
          JSON array. Defaults to the two extremes: net8, the oldest asset set and the one nothing
          else exercises, and net10, whose assets are produced by the merge step in
          BuildNugets.sh and so are the only ones that could be grafted in wrong. net9 sits
          between them and comes out of the same pack pass as net8, so testing it too would buy
          little for the runner minutes.
        required: false
        default: '["net8.0-ios18.0", "net10.0-ios26.0"]'
        type: string
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: pack
    # Pinned rather than macos-latest so an image roll cannot change which Xcode versions are
    # available to the select-xcode action.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workloads for every SDK band
        run: |
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install ios )
          done

      - name: Cache the fetched xcframeworks
        id: xcframework
        uses: actions/cache@v4
        with:
          # Both destinations build/fetch-opentok.sh stages into - the binding's
          # OpenTok.xcframework AND the payload package's OpenTokTransformers.xcframework. Caching
          # only the first was a partial save: the next run hit it, skipped the fetch below, and
          # the transformers pack died on its missing NativeResource. The key prefix moved to
          # -xcframeworks so partial caches saved before this fix can never match again.
          path: |
            src/OpenTok.Net.iOS/lib
            src/OpenTok.Net.Transformers.iOS/lib
          key: opentok-ios-xcframeworks-${{ hashFiles('Directory.Build.props', 'build/checksums.txt') }}

      - name: Fetch the OpenTok iOS SDK
        if: steps.xcframework.outputs.cache-hit != 'true'
        run: ./build/fetch-opentok.sh

      - name: Pack
        run: |
          if [ -n "${{ inputs.suffix }}" ]; then
            ./build/BuildNugets.sh --suffix "${{ inputs.suffix }}"
          else
            ./build/BuildNugets.sh
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  validate:
    name: validate package
    if: ${{ inputs.verify }}
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run package tests
        run: dotnet test tests/OpenTok.Net.iOS.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  sample:
    name: build sample app
    if: ${{ inputs.verify }}
    timeout-minutes: 30
    needs: pack
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # The sample consumes the packed package exactly as a user would: it restores from
      # artifacts/ (see NuGet.config) and links against OTSession/OTPublisher/OTSubscriber
      # directly, with no cross-platform façade in between.
      #
      # Debug, and pinned to a simulator runtime identifier: a Release build triggers full AOT
      # compilation and linking, which costs real runner time for no added signal on whether the
      # package restores and links correctly. Both target frameworks the .NET 9 band covers are
      # built, since at this cost it is free; the sample deliberately does not target net10 — the
      # device tests cover that.
      - name: Build the sample against the packed package
        run: |
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          dotnet build samples/OpenTok.Sample.iOS \
            --configuration Debug \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:OpenTokPackageVersion="${OPENTOK_PACKAGE_VERSION}${s}"

  # What every Debug job above cannot reach, and the reason this one exists.
  #
  # Debug leaves the managed linker switched off and AOT unused, so those jobs can only answer
  # whether the package restores and compiles. A binding package's most interesting failures are
  # downstream of that:
  #
  #   * The managed linker walks the whole assembly graph and removes what it decides is
  #     unreachable. Types reached only through the Objective-C runtime — every [Model] delegate
  #     subclass here — are exactly the shape it can get wrong.
  #   * The *device* slice is a different slice, built from a different archive, and nothing else
  #     in this pipeline links it at all. The simulator legs stay green through a package whose
  #     device slice was empty, mis-stripped or built for the wrong minimum OS version.
  #   * OpenTok.xcframework is a static archive force-loaded with -ObjC, so every undefined symbol
  #     in it has to be satisfied at link time by a system framework this repository names by hand
  #     in OpenTok.Net.iOS.csproj. A missing one is a link error in a *consumer's* app and nowhere
  #     else — which is precisely how the previously published 2.27.1.701 shipped without Network,
  #     Accelerate and CoreFoundation.
  #
  # Code signing is off: a public runner has neither a certificate nor a provisioning profile, and
  # neither affects whether the thing links. The .app being produced is the assertion, since AOT
  # and the native link both run before the bundle is assembled.
  device-link:
    name: link for a device (Release)
    timeout-minutes: 45
    needs: pack
    if: ${{ inputs.verify }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # One target framework, not all three. Each band carries its own copy of the payload, but the
      # copies hold the same framework entry for entry — asserted directly by the package tests, in
      # Native_payload_is_the_same_across_target_frameworks — so a second band would spend another
      # half hour linking native bits this one has already linked.
      - name: Link the sample for a real device
        run: |
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          tfm=net9.0-ios18.0

          dotnet build samples/OpenTok.Sample.iOS \
            --configuration Release \
            --framework "${tfm}" \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:OpenTokPackageVersion="${OPENTOK_PACKAGE_VERSION}${s}"

          app="samples/OpenTok.Sample.iOS/bin/Release/${tfm}/ios-arm64/OpenTok.Sample.iOS.app"
          if [ ! -d "${app}" ]; then
            echo "::error::${app} was not produced — AOT or the native link failed"
            exit 1
          fi

          # Reported rather than asserted on a count: how many assemblies survive the linker is the
          # linker's business and moves with every SDK update. The bundle existing is the check.
          echo "linked ${app}"
          ls "${app}"/*.dll 2>/dev/null | wc -l | xargs echo "assemblies surviving the linker:"

  # The transformers package's own device link. Separate from the job above because it is a
  # separate failure: that one carries a *static* archive embedded into the binding assembly, this
  # one a *dynamic* framework that has to be copied into the .app and re-signed, and only a device
  # build exercises the copy-and-sign path with the device slice. A simulator build would link the
  # simulator slice and tell us nothing about it.
  transformers-link:
    name: link the transformers for a device (Release)
    timeout-minutes: 45
    needs: pack
    if: ${{ inputs.verify }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # The device tests, not the sample: the sample does not reference the transformers package,
      # and adding it there would make every sample build pay 68 MB of payload for a feature it
      # does not demonstrate. The device-test app takes it through OpenTokTransformersPackageVersion.
      - name: Link the device tests with the transformers package
        run: |
          . ./build/pins.sh
          s="${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          tfm=net9.0-ios18.0

          dotnet build tests/OpenTok.Net.iOS.DeviceTests \
            --configuration Release \
            --framework "${tfm}" \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:OpenTokDevicePackageVersion="${OPENTOK_PACKAGE_VERSION}${s}" \
            -p:OpenTokIncludeTransformers=true

          app="tests/OpenTok.Net.iOS.DeviceTests/bin/Release/${tfm}/ios-arm64/OpenTok.Net.iOS.DeviceTests.app"
          if [ ! -d "${app}" ]; then
            echo "::error::${app} was not produced"
            exit 1
          fi

          # The point of the job: the dynamic framework has to be *in the bundle*, not merely
          # linked against. A binding that resolved it at build time and failed to copy it produces
          # an app that launches and then dies on first use with a dyld error.
          if [ ! -d "${app}/Frameworks/OpenTokTransformers.framework" ]; then
            echo "::error::OpenTokTransformers.framework was not copied into the app bundle"
            find "${app}" -maxdepth 2 -name '*.framework' -print
            exit 1
          fi

          echo "OpenTokTransformers.framework is present in the bundle"

  e2e:
    name: simulator smoke test (${{ matrix.target-framework }})
    if: ${{ inputs.verify }}
    timeout-minutes: 45
    needs: pack
    runs-on: macos-15
    strategy:
      # fail-fast off: when one leg breaks it is worth knowing whether the other did too, since
      # "net8 only" and "both" point at very different causes.
      fail-fast: false
      matrix:
        target-framework: ${{ fromJSON(inputs.e2e-target-frameworks) }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS workload
        run: |
          # The device app is built for the target framework under test, so install the workload
          # for the band that owns it. global.json pins .NET 9; the app may need .NET 10.
          mkdir -p "${RUNNER_TEMP}/sdk10"
          ( cd "${RUNNER_TEMP}/sdk10" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install ios )
          dotnet workload install ios

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Run smoke tests on simulator
        run: |
          . ./build/pins.sh
          version="${OPENTOK_PACKAGE_VERSION}${{ inputs.suffix != '' && format('-{0}', inputs.suffix) || '' }}"
          ./.github/scripts/run-simulator-tests.sh "${version}" "${{ matrix.target-framework }}"

      - name: Upload simulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-logs-${{ matrix.target-framework }}
          path: simulator-tests.log
          if-no-files-found: ignore
          retention-days: 7
